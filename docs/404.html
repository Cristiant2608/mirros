<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Not Found — MirrOS</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="icon" type="image/svg+xml" href="icon.svg" />
  <meta name="theme-color" content="#0b0f17" />
  <style>
    :root {
      --bg: #0b0f17;
      --card: #161e2e;
      --text: #edf2f7;
      --muted: #a0aec0;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --line: rgba(255, 255, 255, 0.08);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
      background: radial-gradient(circle at top center, #172554 0%, var(--bg) 60%);
      color: var(--text);
      text-align: center;
    }
    .panel {
      max-width: 560px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 40px 32px;
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.5);
    }
    .code {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      background: rgba(59, 130, 246, 0.16);
      color: #93c5fd;
      border: 1px solid rgba(59, 130, 246, 0.35);
      margin-bottom: 16px;
    }
    h1 { margin: 0 0 12px; font-size: 28px; letter-spacing: -0.5px; }
    p { margin: 0 0 28px; color: var(--muted); line-height: 1.6; }
    .actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      padding: 11px 18px;
      border-radius: 10px;
      text-decoration: none;
      font-weight: 600;
      font-size: 14px;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.04);
      color: var(--text);
    }
    .btn-primary {
      background: var(--accent);
      border-color: transparent;
      color: #fff;
    }
    .btn-primary:hover { background: var(--accent-hover); }
  </style>
</head>
<body>
  <main class="panel">
    <span class="code">404 · Page Not Found</span>
    <h1>This MirrOS page moved or doesn't exist</h1>
    <p>Visit the main landing page, browse the source repository, or download the latest Windows and Linux releases.</p>
    <div class="actions">
      <a class="btn btn-primary" href="./">Back to MirrOS Home</a>
      <a class="btn" href="https://github.com/Cristiant2608/mirros/blob/main/docs/USAGE.md">Usage Guide</a>
      <a class="btn" href="https://github.com/Cristiant2608/mirros/releases">Releases</a>
    </div>
  </main>
</body>
</html>
