[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mirros"
version = "1.3.0"
description = "Open-source iPhone screen mirroring, audio streaming, screen recording, and USB HID control for Windows and Linux (scrcpy for iOS)"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Win32 (MS Windows)",
    "Environment :: X11 Applications",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video :: Display",
    "Topic :: System :: Hardware :: Universal Serial Bus (USB)",
    "Topic :: Utilities",
]
keywords = [
    "iphone-mirroring",
    "ios",
    "iphone",
    "scrcpy",
    "ios-scrcpy",
    "screen-mirroring",
    "remote-control",
    "usb",
    "windows",
    "linux",
    "pymobiledevice3",
]
dependencies = ["pymobiledevice3==11.32.0", "wsproto>=1.3.2,<2"]

[project.urls]
Homepage = "https://github.com/Cristiant2608/mirros"
Repository = "https://github.com/Cristiant2608/mirros.git"
Releases = "https://github.com/Cristiant2608/mirros/releases"
Issues = "https://github.com/Cristiant2608/mirros/issues"

[project.scripts]
mirros = "mirros.cli:main"
ios-scrcpy = "mirros.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mirros = ["assets/*.js", "web/*"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E9", "F", "W6"]
