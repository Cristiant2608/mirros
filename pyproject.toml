[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ios-scrcpy"
version = "1.1.0"
description = "Visualiza y controla tu iPhone desde Windows o Linux"
requires-python = ">=3.10"
dependencies = ["pymobiledevice3==11.32.0"]

[project.scripts]
ios-scrcpy = "ios_scrcpy.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ios_scrcpy = ["assets/*.js", "web/*"]
