name: ✨ Feature Request / Propuesta de mejora
description: Suggest an improvement for the Electron/React desktop app, CLI, or USB transport.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or Use Case / ¿Qué necesidad resuelve?
      description: Explain what you want to achieve when using MirrOS on Windows or Linux.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed Solution / Solución propuesta
      description: Describe how it should work in the UI or CLI (`mirros`).
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional Technical Context (optional)
      description: "Do you know if `pymobiledevice3` or iOS 17.4+ exposes the required service over USB?"
