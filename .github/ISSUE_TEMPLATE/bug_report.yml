name: 🐛 Bug Report / Reporte de error
description: Report a USB connection, video, audio, touch input, or desktop app issue (without personal data).
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve **MirrOS**! (You can write in English or Spanish).
        > **Privacy:** Never include your UDID, personal iPhone name, file paths containing your username, or private clipboard contents.

  - type: dropdown
    id: platform
    attributes:
      label: Operating System / Sistema operativo
      options:
        - Windows 11 x64
        - Windows 10 x64
        - Linux — Ubuntu / Debian
        - Linux — Arch / CachyOS / Manjaro
        - Linux — Fedora / RHEL
        - Linux — Other distribution
    validations:
      required: true

  - type: dropdown
    id: method
    attributes:
      label: Installation Method / Método de ejecución
      options:
        - Windows Portable Executable (.exe)
        - Linux Portable AppImage (.AppImage)
        - From Source — Desktop Studio (pnpm start)
        - From Source — Terminal CLI (mirros / ios-scrcpy)
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: MirrOS & iOS Version
      description: "Example: MirrOS 1.2.0, iPhone 15 on iOS 18.2 (on Linux, also note X11 or Wayland)."
      placeholder: "MirrOS 1.2.0 / iOS 18.2 / Wayland"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened & steps to reproduce?
      description: Describe the exact steps and observed behavior vs. expected behavior.
      placeholder: |
        1. Connect iPhone over USB with Developer Mode enabled.
        2. Open MirrOS and click...
        3. Observed result: ...
    validations:
      required: true

  - type: textarea
    id: diagnostics
    attributes:
      label: Sanitized Diagnostics (optional)
      description: "Paste the output of `mirros --diagnose` or `python -m mirros.diagnostics` (verify no private paths are included)."
      render: json
