name: 📱 Device Compatibility Report / Reporte de compatibilidad
description: Share which iPhone model, iOS version, and operating system you tested with MirrOS.
title: "[Compatibility]: "
labels: ["documentation"]
body:
  - type: markdown
    attributes:
      value: |
        Use this template to record tests with a **physical iPhone** on Windows or Linux and help keep the [Compatibility Matrix](https://github.com/Cristiant2608/mirros/blob/main/docs/COMPATIBILIDAD.md) up to date.
        > **Privacy:** Never attach UDIDs, serial numbers, or screenshots containing personal data.

  - type: input
    id: environment
    attributes:
      label: Operating System & MirrOS Version
      placeholder: "Example: Windows 11 24H2 / Ubuntu 24.04 (Wayland) — MirrOS 1.2.0"
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: iPhone Model & iOS Version
      placeholder: "Example: iPhone 15 Pro — iOS 18.2"
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Physically Verified Features
      description: Check only the features you tested directly with the USB-connected device.
      options:
        - label: USB detection & automatic Developer Disk Image (DDI) preparation
        - label: Live video stream (specify below if Native HEVC or Software MJPEG was used)
        - label: Touch, drag, mouse-wheel scroll, and edge swipe gestures
        - label: App Switcher (`Ctrl+M`), Control Center, and Installed Apps viewer
        - label: PC keyboard typing and modifier release on window blur
        - label: Real-time iPhone audio on PC
        - label: Bidirectional clipboard (`Ctrl+C` / `Ctrl+V`) with Unicode text and PNG images
        - label: Screen & audio recording (`Ctrl+Shift+R`)
        - label: AOD / Standby Mode (`Ctrl+L`) and Wake (`Ctrl+U`)
        - label: Safe disconnect and USB cable reconnection

  - type: textarea
    id: notes
    attributes:
      label: Notes / Observaciones
      placeholder: "Any extra details (approximate FPS, video decode mode used, Linux compositor, etc.)."
