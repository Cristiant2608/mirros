name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      verify_only:
        description: Build and check distribution packages without publishing
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v7
      - name: Build sdist and wheel
        run: |
          uv build
          uvx twine check dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: python-dist
          path: dist/*

  publish:
    needs: build
    if: >-
      (github.event_name == 'release' && vars.MIRROS_PYPI_PUBLISH == 'true') ||
      (github.event_name == 'workflow_dispatch' && inputs.verify_only == false)
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/mirros
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python-dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
