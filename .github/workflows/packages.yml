name: Desktop packages
on:
  push:
    branches: [main, feat/windows-linux-desktop]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: python -m venv .venv
      - name: Install Linux desktop libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfuse2 libgtk-3-0 libnss3 libasound2 xvfb
      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          .venv/Scripts/python.exe -m pip install -e .
          .venv/Scripts/python.exe -m pip check
          .venv/Scripts/python.exe -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { throw "Python checks failed" }
          ./build-windows.ps1
      - name: Package Linux
        if: runner.os == 'Linux'
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: |
          .venv/bin/python -m pip install -e .
          .venv/bin/python -m pip check
          .venv/bin/python -m unittest discover -s tests -v
          ./build-linux.sh
      - name: Smoke test Windows desktop
        if: runner.os == 'Windows'
        run: node scripts/smoke-desktop.mjs ../Mirros-Windows/win-unpacked/Mirros.exe
      - name: Smoke test Linux AppImage
        if: runner.os == 'Linux'
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: xvfb-run -a node scripts/smoke-desktop.mjs ../Mirros-Linux/*.AppImage
      - name: Render software video and simulated UI on Linux
        if: runner.os == 'Linux'
        env:
          MIRROS_SOFTWARE_DEMO: '1'
        run: node scripts/capture-ui.mjs
      - name: Stage Windows artifact
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts
          Copy-Item ../Mirros-Windows/Mirros-*-Windows.exe artifacts/
      - name: Stage Linux artifact
        if: runner.os == 'Linux'
        run: mkdir -p artifacts && cp ../Mirros-Linux/*.AppImage artifacts/
      - name: Upload Windows package
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: Mirros-Windows
          path: artifacts/Mirros-*-Windows.exe
          if-no-files-found: error
          compression-level: 0
      - name: Upload Linux package
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: Mirros-Linux
          path: artifacts/*.AppImage
          if-no-files-found: error
          compression-level: 0
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'Cristiant2608/mirros'
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: Mirros-*
          path: release
          merge-multiple: true
      - name: Publish a version only after both packages passed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node -p 'require("./package.json").version')"
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "Version already published; bump package.json for the next release."
            exit 0
          fi
          git archive --format=zip --prefix="mirros-$version/" -o "release/Mirros-$version-Source.zip" HEAD
          gh release create "v$version" release/* --target "$GITHUB_SHA" --title "Mirros $version" --notes-file CHANGELOG.md
